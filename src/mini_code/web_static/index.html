<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MiniCode · Coding Agent</title>
  <meta name="description" content="MiniCode 本地多轮 Coding Agent 对话界面">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/diff.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">M</span><div><strong>MiniCode</strong><small>LOCAL CODING AGENT</small></div></div>
      <button class="new-chat" id="new-chat" type="button"><span>＋</span> 新建对话</button>
      <p class="section-label">最近对话</p>
      <nav id="conversation-list" aria-label="对话历史"><p class="muted">正在读取…</p></nav>
      <footer><span class="live-dot"></span>仅限本机 · 工作区已固定</footer>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <button class="icon-button mobile-only" id="menu-toggle" type="button" aria-label="打开历史">☰</button>
        <div class="header-copy"><strong id="chat-title">新对话</strong><span id="connection">准备就绪</span></div>
        <button class="inspect-toggle" id="inspect-toggle" type="button">运行详情 <span id="detail-badge">0</span></button>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="welcome" id="welcome">
          <span class="welcome-mark">M</span>
          <h1>今天想一起改点什么？</h1>
          <p>描述一个真实的编程任务。MiniCode 会先探索代码，再制定计划、修改文件并运行测试。</p>
          <div class="prompts">
            <button type="button" data-prompt="先阅读项目结构，找出最值得修复的一个问题，并在验证后完成修改。"><strong>探索并修复</strong><span>阅读仓库，选择一个可验证的问题</span></button>
            <button type="button" data-prompt="为当前项目补充一个有价值的功能，并添加对应测试。"><strong>实现新功能</strong><span>计划、编码、测试和 Diff 一次完成</span></button>
          </div>
        </div>
      </section>

      <div class="composer-wrap">
        <div class="mode-picker" id="mode-picker" role="group" aria-label="运行模式">
          <button type="button" class="active" data-mode="auto" title="自动判断普通对话、仓库问答或编码任务">自动</button>
          <button type="button" data-mode="chat" title="不读取仓库，不调用工具">对话</button>
          <button type="button" data-mode="code" title="强制执行完整 Coding Agent 流程">编码</button>
        </div>
        <form class="composer" id="composer">
          <textarea id="message-input" rows="1" maxlength="8000" placeholder="给 MiniCode 发消息…" aria-label="消息"></textarea>
          <button id="send-message" class="send" type="submit" aria-label="发送">↑</button>
          <button id="stop-run" class="stop hidden" type="button" aria-label="停止运行">■</button>
        </form>
        <p class="composer-note"><span id="form-error" role="alert"></span><span id="mode-note">自动模式会先判断意图，只有明确修改请求才会更改文件。</span></p>
      </div>
    </main>

    <aside class="inspector" id="inspector" aria-label="运行详情">
      <header><div><p>RUN INSPECTOR</p><strong id="run-label">尚未运行</strong></div><button id="close-inspector" type="button" aria-label="关闭">×</button></header>
      <div class="inspector-scroll">
        <section class="inspector-section">
          <div class="section-heading"><h2>执行计划</h2><span id="step-label">—</span></div>
          <ol id="plan" class="plan"><li class="muted">发送消息后生成计划</li></ol>
        </section>
        <section class="inspector-section">
          <div class="section-heading"><h2>验证证据</h2></div>
          <div id="evidence" class="evidence"><p class="muted">暂无证据</p></div>
        </section>
        <section class="inspector-section">
          <div class="section-heading"><h2>Session Diff</h2><button id="copy-diff" type="button">复制</button></div>
          <pre id="diff">等待 Agent 查看 Diff</pre>
        </section>
        <section class="inspector-section">
          <div class="section-heading"><h2>事件时间线</h2><span id="event-count">0</span></div>
          <div id="timeline" class="timeline"></div>
        </section>
      </div>
    </aside>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
